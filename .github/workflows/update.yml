name: Atualizar notícias do painel

on:
  schedule:
    - cron: "0 */2 * * *"   # a cada 2 horas (horário UTC)
  workflow_dispatch: {}       # permite rodar manualmente pelo botão "Run workflow"
  push:
    branches: [ main ]        # atualiza também a cada alteração no projeto

permissions:
  contents: write

concurrency:
  group: atualizar-noticias
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Buscar notícias
        run: node fetch-news.mjs

      - name: Salvar data.json (se mudou)
        run: |
          git config user.name "painel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Sem novidades — nada a publicar."
          else
            git commit -m "chore: atualiza notícias [skip ci]"
            git push
          fi

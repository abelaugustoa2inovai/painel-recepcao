<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Recepção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
  :root{
    --ground:#0d1420; --ground-2:#0a101a; --surface:#16202e; --surface-2:#1c2a3c;
    --line:#26374d; --text:#f1f5fb; --muted:#8fa3bd; --muted-2:#6d829e;
    --amber:#f6a723; --amber-soft:#ffce6b; --steel:#49a6ef; --rose:#ff7ba6; --good:#43d69a;
    --shadow:0 24px 60px -20px rgba(0,0,0,.65);
    --font-body:"Barlow",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --font-disp:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(1200px 800px at 82% -10%, rgba(73,166,239,.10), transparent 60%),
      radial-gradient(1000px 700px at 8% 110%, rgba(246,167,35,.10), transparent 55%),
      var(--ground);
    color:var(--text); font-family:var(--font-body);
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%}
  .frame{height:100vh;width:100vw;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(18px,2.4vw,40px);gap:clamp(14px,1.8vh,26px)}

  header{display:flex;align-items:center;justify-content:space-between;gap:24px}
  .brand{display:flex;align-items:center;gap:clamp(12px,1.2vw,18px);min-width:0}
  .logo{width:clamp(60px,4.8vw,88px);height:clamp(60px,4.8vw,88px);border-radius:16px;flex:none;background:#f4f6fb;display:grid;place-items:center;padding:9px;box-shadow:0 10px 26px -10px rgba(0,0,0,.55)}
  .logo img{width:100%;height:100%;object-fit:contain}
  .brand-txt{display:flex;flex-direction:column;min-width:0}
  .brand-name{font-family:var(--font-disp);font-weight:700;font-size:clamp(22px,2.2vw,38px);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .clock-wrap{display:flex;flex-direction:column;align-items:center;line-height:1}
  .clock{font-family:var(--font-disp);font-weight:700;font-variant-numeric:tabular-nums;font-size:clamp(46px,5.6vw,104px);letter-spacing:.01em;display:flex;align-items:baseline;gap:.12em}
  .clock .sec{font-size:.42em;color:var(--amber);font-weight:600}
  .date{font-family:var(--font-disp);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-size:clamp(12px,1.05vw,19px);margin-top:.35em;font-weight:600}

  .weather{display:flex;align-items:center;gap:clamp(12px,1.1vw,18px);background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:18px;padding:clamp(12px,1.1vw,18px) clamp(16px,1.4vw,24px);box-shadow:var(--shadow);flex:none}
  .weather .ico{width:clamp(38px,3.4vw,58px);height:clamp(38px,3.4vw,58px);color:var(--steel);flex:none}
  .weather .temp{font-family:var(--font-disp);font-weight:700;font-size:clamp(30px,3.1vw,54px);line-height:.95;font-variant-numeric:tabular-nums}
  .weather .temp span{color:var(--steel)}
  .weather .wx-meta{display:flex;flex-direction:column;gap:.15em}
  .weather .wx-city{font-family:var(--font-disp);font-weight:600;font-size:clamp(12px,1vw,17px);text-transform:uppercase;letter-spacing:.08em}
  .weather .wx-cond{color:var(--muted);font-size:clamp(11px,.92vw,15px)}
  .weather .wx-min{color:var(--muted-2);font-size:clamp(11px,.9vw,14px);font-variant-numeric:tabular-nums}

  .stage{position:relative;border-radius:26px;overflow:hidden;background:linear-gradient(165deg,var(--surface),var(--ground-2));border:1px solid var(--line);box-shadow:var(--shadow)}
  .slide{position:absolute;inset:0;padding:clamp(24px,3.4vw,64px);display:flex;flex-direction:column;justify-content:center;opacity:0;transform:scale(1.015);transition:opacity .8s ease,transform .8s ease;pointer-events:none}
  .slide.active{opacity:1;transform:none}
  .slide .kicker{font-family:var(--font-disp);text-transform:uppercase;letter-spacing:.24em;font-weight:600;font-size:clamp(13px,1.15vw,20px);display:flex;align-items:center;gap:.7em;margin-bottom:clamp(14px,1.6vh,26px)}
  .slide .kicker::before{content:"";width:clamp(30px,3vw,54px);height:4px;border-radius:2px;background:var(--amber)}

  .news-k{color:var(--amber-soft)}
  .news-title{font-family:var(--font-disp);font-weight:700;font-size:clamp(33px,4.5vw,82px);line-height:1.04;letter-spacing:-.012em;text-wrap:balance;max-width:24ch;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .news-summary{margin-top:clamp(14px,2vh,28px);font-size:clamp(18px,1.7vw,32px);color:var(--muted);line-height:1.34;max-width:46ch;font-weight:400;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .news-src{margin-top:clamp(16px,2.2vh,30px);display:flex;align-items:center;gap:.7em;font-family:var(--font-disp);text-transform:uppercase;letter-spacing:.12em;color:var(--muted-2);font-size:clamp(12px,1vw,17px);font-weight:600}
  .news-src .dot{width:.55em;height:.55em;border-radius:50%;background:var(--steel)}
  .news-src .time{color:var(--muted-2);text-transform:none;letter-spacing:0;font-weight:500}

  .slide.news-slide{display:grid;grid-template-columns:1.14fr .86fr;gap:clamp(24px,3vw,56px);align-items:center;justify-content:initial}
  .news-main{display:flex;flex-direction:column;min-width:0}
  .news-art{align-self:stretch;min-height:0;display:flex}
  .artbox{position:relative;flex:1;border-radius:22px;overflow:hidden;display:grid;place-items:center;border:1px solid rgba(255,255,255,.08)}
  .artbox .art-ico{width:42%;height:42%;color:rgba(255,255,255,.92);filter:drop-shadow(0 8px 20px rgba(0,0,0,.35))}
  .artbox .art-wm{position:absolute;right:-8%;bottom:-14%;width:60%;height:60%;color:rgba(255,255,255,.07)}
  .artchip{position:absolute;left:clamp(16px,1.4vw,24px);bottom:clamp(16px,1.6vh,24px);font-family:var(--font-disp);text-transform:uppercase;letter-spacing:.14em;font-weight:600;font-size:clamp(12px,1vw,17px);color:#fff;background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:.35em .9em;backdrop-filter:blur(4px)}
  .artphoto{position:relative;flex:1;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:var(--ground-2)}
  .artphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .artphoto .grad{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(6,10,16,.72) 100%)}
  @media (max-width:820px){ .slide.news-slide{grid-template-columns:1fr} .news-art{display:none} }

  .bday-k{color:var(--rose)}
  .bday-k::before{background:var(--rose)}
  .bday-title{font-family:var(--font-disp);font-weight:700;font-size:clamp(30px,3.6vw,64px);line-height:1;margin-bottom:clamp(16px,2vh,30px)}
  .bday-title em{color:var(--rose);font-style:normal}
  .bday-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:clamp(12px,1.2vw,20px);align-content:start;overflow:hidden}
  .bday-card{display:flex;align-items:center;gap:clamp(12px,1vw,18px);background:linear-gradient(150deg,rgba(255,123,166,.14),rgba(255,123,166,.05));border:1px solid rgba(255,123,166,.28);border-radius:18px;padding:clamp(12px,1.1vw,18px) clamp(14px,1.3vw,22px)}
  .bday-avatar{flex:none;width:clamp(58px,4.8vw,84px);height:clamp(58px,4.8vw,84px);border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(150deg,var(--rose),#e05a86);color:#2a0d18;font-family:var(--font-disp);font-weight:700;font-size:clamp(20px,1.8vw,32px);border:2px solid rgba(255,123,166,.5)}
  .bday-avatar img{width:100%;height:100%;object-fit:cover}
  .bday-info{display:flex;flex-direction:column;min-width:0;flex:1}
  .bday-name{font-family:var(--font-disp);font-weight:600;font-size:clamp(19px,1.7vw,30px);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bday-dept{color:var(--muted);font-size:clamp(12px,1vw,16px)}
  .bday-day{font-family:var(--font-disp);font-weight:700;flex:none;margin-left:auto;text-align:center;line-height:.9;padding:clamp(6px,.6vw,11px) clamp(10px,1vw,16px);border-radius:12px;background:rgba(255,123,166,.16);border:1px solid rgba(255,123,166,.32)}
  .bday-day b{font-size:clamp(20px,1.8vw,32px);display:block;font-variant-numeric:tabular-nums;color:var(--text)}
  .bday-day small{font-size:clamp(9px,.75vw,12px);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

  .note-k{color:var(--steel)}
  .note-k::before{background:var(--steel)}
  .note-title{font-family:var(--font-disp);font-weight:700;font-size:clamp(34px,4vw,74px);line-height:1.04;letter-spacing:-.01em;text-wrap:balance;max-width:22ch}
  .note-body{margin-top:clamp(16px,2vh,32px);font-size:clamp(19px,1.8vw,36px);color:var(--muted);line-height:1.35;max-width:40ch}

  .idle{align-items:center;text-align:center}
  .idle .big{font-family:var(--font-disp);font-weight:700;font-size:clamp(40px,5vw,90px);line-height:1.05}
  .idle .sub{color:var(--muted);font-size:clamp(18px,1.8vw,32px);margin-top:.4em}

  .dots{position:absolute;bottom:clamp(16px,2vh,26px);left:50%;transform:translateX(-50%);display:flex;gap:9px}
  .dots i{width:9px;height:9px;border-radius:50%;background:var(--line);transition:all .4s ease}
  .dots i.on{width:26px;border-radius:6px;background:var(--amber)}

  .ticker{display:flex;align-items:stretch;background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  .ticker .label{flex:none;display:flex;align-items:center;gap:.6em;padding:0 clamp(16px,1.4vw,26px);background:linear-gradient(150deg,var(--amber),#d9861a);color:#1c1204;font-family:var(--font-disp);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:clamp(13px,1.15vw,20px)}
  .ticker .label svg{width:1.15em;height:1.15em}
  .ticker .view{position:relative;flex:1;overflow:hidden;display:flex;align-items:center}
  .ticker .track{display:inline-flex;align-items:center;white-space:nowrap;will-change:transform;animation:scroll 60s linear infinite}
  .ticker .item{padding:clamp(12px,1.3vh,20px) 0;font-size:clamp(16px,1.35vw,26px);color:var(--text);font-weight:500;display:inline-flex;align-items:center}
  .ticker .item::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber);margin:0 clamp(22px,2.4vw,44px)}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  @media (prefers-reduced-motion:reduce){ .slide{transition:opacity .3s ease} .ticker .track{animation:none} }
</style>
</head>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22V4a1 1 0 0 1 1-1h13l3 3v13"/><path d="M8 7h7M8 11h7M8 15h4"/></svg>
      Notícias
    </div>
    <div class="view"><div class="track" id="track"></div></div>
  </div>
</div>

<script src="config.js"></script>
<script>
const CFG = window.PAINEL_CONFIG || {};
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MESES_ABREV = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];

let state = { news: [], birthdays: [], notices: [], weather: null };

/* ---------------- utils ---------------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function norm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim(); }
function ago(ts){
  if(!ts) return "";
  const d = Math.max(0, Date.now()-ts), min = Math.round(d/60000);
  if(min < 60) return min<=1?"agora":`há ${min} min`;
  const h = Math.round(min/60); if(h < 24) return `há ${h} h`;
  const dias = Math.round(h/24); return dias===1?"ontem":`há ${dias} dias`;
}

/* ---------------- relógio ---------------- */
function tick(){
  const d = new Date();
  document.getElementById("hm").textContent = String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  document.getElementById("ss").textContent = String(d.getSeconds()).padStart(2,"0");
  const wd = d.toLocaleDateString("pt-BR",{weekday:"long"});
  document.getElementById("date").textContent = wd.charAt(0).toUpperCase()+wd.slice(1)+", "+d.getDate()+" de "+MESES[d.getMonth()];
  if(d.getHours()===4 && d.getMinutes()===0 && d.getSeconds()===0) location.reload();
}
setInterval(tick,1000); tick();

/* ---------------- clima (Open-Meteo, grátis) ---------------- */
function wmo(code){
  if(code===0) return {t:"Céu limpo", k:"sol"};
  if(code<=2) return {t:"Sol com nuvens", k:"sol"};
  if(code===3) return {t:"Nublado", k:"nublado"};
  if(code<=48) return {t:"Névoa", k:"nublado"};
  if(code<=67) return {t:"Chuva", k:"chuva"};
  if(code<=77) return {t:"Neve", k:"nublado"};
  if(code<=82) return {t:"Pancadas de chuva", k:"chuva"};
  if(code<=99) return {t:"Tempestade", k:"chuva"};
  return {t:"—", k:"nublado"};
}
function wxIcon(k){
  if(k==="chuva") return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16a4.5 4.5 0 0 1 .5-9 6 6 0 0 1 11.5 2.2A3.6 3.6 0 0 1 18 16H7z"/><path d="M8 19l-1 2M12 19l-1 2M16 19l-1 2"/></svg>';
  if(k==="sol") return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></svg>';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1 .5-9 6 6 0 0 1 11.5 2.2A3.6 3.6 0 0 1 18 18H7z"/></svg>';
}
async function loadWeather(){
  const w = CFG.weather||{};
  if(w.lat==null) return;
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto&forecast_days=1`;
    const r = await fetch(url); const j = await r.json();
    const code = j.current?.weather_code ?? j.daily?.weather_code?.[0] ?? 3;
    state.weather = {
      city: w.city||"",
      temp: Math.round(j.current?.temperature_2m ?? 0),
      max: Math.round(j.daily?.temperature_2m_max?.[0] ?? 0),
      min: Math.round(j.daily?.temperature_2m_min?.[0] ?? 0),
      ...wmo(code)
    };
    renderWeather();
  }catch(e){ /* mantém o que tiver */ }
}
function renderWeather(){
  const w = state.weather; if(!w) return;
  document.getElementById("wxTemp").textContent = w.temp;
  document.getElementById("wxMax").textContent = w.max;
  document.getElementById("wxMin").textContent = w.min;
  document.getElementById("wxCity").textContent = w.city;
  document.getElementById("wxCond").textContent = w.t;
  document.getElementById("wxIco").innerHTML = wxIcon(w.k);
}

/* ---------------- arte de reserva por categoria ---------------- */
const NEWS_ART = {
  local:{c1:"#b23a3a",c2:"#5a1717",ico:'<path d="M12 21s-6-5.7-6-10a6 6 0 1 1 12 0c0 4.3-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/>'},
  mercado:{c1:"#1f6f9a",c2:"#0c3348",ico:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>'},
  esportes:{c1:"#2f8f5a",c2:"#123a24",ico:'<path d="M7 4h10v3a5 5 0 0 1-10 0z"/><path d="M7 5H4v1a3 3 0 0 0 3 3M17 5h3v1a3 3 0 0 1-3 3"/><path d="M12 12v4M9 20h6M10 16h4"/>'},
  tecnologia:{c1:"#5a44a8",c2:"#271b52",ico:'<rect x="7" y="7" width="10" height="10" rx="1"/><path d="M10 2v3M14 2v3M10 19v3M14 19v3M2 10h3M2 14h3M19 10h3M19 14h3"/>'},
  novidades:{c1:"#3a4a5f",c2:"#18212e",ico:'<path d="M4 5h13v14H4z"/><path d="M17 8h3v9a2 2 0 0 1-2 2"/><path d="M7 8h7M7 11h7M7 14h5"/>'}
};
function newsArt(cat, label){
  const a = NEWS_ART[cat] || NEWS_ART.novidades;
  const svg = (cls)=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${a.ico}</svg>`;
  return `<div class="artbox" style="background:linear-gradient(155deg,${a.c1},${a.c2})">${svg("art-wm")}${svg("art-ico")}<span class="artchip">${esc(label||"")}</span></div>`;
}
function initials(name){
  const p = String(name||"").trim().split(/\s+/).filter(Boolean);
  return ((p[0]&&p[0][0])||"") + ((p.length>1 && p[p.length-1][0])||"") || "•";
}
// troca imagem quebrada pela arte de reserva
window.fixImg = function(img){
  const box = img.closest(".news-art");
  if(box) box.innerHTML = newsArt(box.dataset.cat, box.dataset.label);
};

/* ---------------- slides ---------------- */
const stage = document.getElementById("stage");
const dotsEl = document.getElementById("dots");
let slides = [], idx = 0, timer = null;

function interleave(items){
  // intercala por categoria pra dar variedade
  const groups = {};
  items.forEach(n=>{ (groups[n.category]=groups[n.category]||[]).push(n); });
  const keys = Object.keys(groups); const out = []; let added = true;
  while(added){ added=false; for(const k of keys){ const g=groups[k]; if(g.length){ out.push(g.shift()); added=true; } } }
  return out;
}

function buildSlides(){
  const out = [];
  const news = interleave(state.news||[]);
  const m = new Date().getMonth()+1;
  const bdays = (state.birthdays||[]).filter(b=>Number(b.month)===m).sort((a,b)=>a.day-b.day);
  const notices = state.notices||[];

  if(bdays.length){
    out.push(`<div class="slide">
      <div class="kicker bday-k">Aniversariantes de ${MESES[m-1]}</div>
      <div class="bday-title">Muitas felicidades <em>a você!</em></div>
      <div class="bday-grid">${bdays.slice(0,8).map(b=>`
        <div class="bday-card">
          <div class="bday-avatar">${b.photo?`<img src="${esc(b.photo)}" alt="" onerror="this.remove()">`:esc(initials(b.name))}</div>
          <div class="bday-info"><div class="bday-name">${esc(b.name)}</div>${b.dept?`<div class="bday-dept">${esc(b.dept)}</div>`:""}</div>
          <div class="bday-day"><b>${esc(b.day)}</b><small>${MESES_ABREV[m-1]}</small></div>
        </div>`).join("")}</div></div>`);
  }

  const noticeSlides = notices.map(n=>`<div class="slide">
      <div class="kicker note-k">Aviso interno</div>
      <div class="note-title">${esc(n.title)}</div>
      ${n.body?`<div class="note-body">${esc(n.body)}</div>`:""}</div>`);

  news.forEach((n,i)=>{
    const art = n.image
      ? `<div class="artphoto"><img src="${esc(n.image)}" alt="" onerror="fixImg(this)"><div class="grad"></div><span class="artchip">${esc(n.categoryLabel||"")}</span></div>`
      : newsArt(n.category, n.categoryLabel);
    const t = ago(n.published);
    out.push(`<div class="slide news-slide">
      <div class="news-main">
        <div class="kicker news-k">${esc(n.categoryLabel||"Notícias")}</div>
        <div class="news-title">${esc(n.title)}</div>
        ${n.summary?`<div class="news-summary">${esc(n.summary)}</div>`:""}
        <div class="news-src"><span class="dot"></span>${esc(n.source||"Notícias")}${t?`<span class="time">· ${esc(t)}</span>`:""}</div>
      </div>
      <div class="news-art" data-cat="${esc(n.category)}" data-label="${esc(n.categoryLabel||"")}">${art}</div>
    </div>`);
    // insere um aviso a cada 4 notícias
    if(noticeSlides.length && (i+1)%4===0) out.push(noticeSlides[((i+1)/4-1)%noticeSlides.length]);
  });

  if(!news.length) noticeSlides.forEach(s=>out.push(s));
  if(!out.length) out.push(`<div class="slide idle"><div class="big">Bem-vindo(a)!</div><div class="sub">É um prazer receber você aqui.</div></div>`);
  return out;
}

function renderSlides(){
  const wasIdx = idx;
  const html = buildSlides();
  [...stage.querySelectorAll(".slide")].forEach(s=>s.remove());
  slides = html.map(h=>{
    const wrap = document.createElement("div"); wrap.innerHTML = h.trim();
    const el = wrap.firstChild; stage.insertBefore(el, dotsEl); return el;
  });
  dotsEl.innerHTML = slides.map(()=>'<i></i>').join("");
  idx = Math.min(wasIdx, slides.length-1); if(idx<0) idx=0;
  show(idx); restart();
}
function show(i){
  if(!slides.length) return;
  idx = (i+slides.length)%slides.length;
  slides.forEach((s,k)=>s.classList.toggle("active",k===idx));
  [...dotsEl.children].forEach((d,k)=>d.classList.toggle("on",k===idx));
}
function restart(){
  if(timer) clearInterval(timer);
  const sec = Math.max(6, Number(CFG.slideSeconds)||10);
  timer = setInterval(()=>show(idx+1), sec*1000);
}

/* ---------------- ticker ---------------- */
function renderTicker(){
  const items = (state.news||[]).map(n=>`<span class="item">${esc(n.title)}</span>`).join("")
             || `<span class="item">Bem-vindo(a) à nossa empresa</span>`;
  const track = document.getElementById("track");
  track.innerHTML = items + items;
  // velocidade constante e confortável de leitura (~38 px/s), independente da quantidade de notícias
  requestAnimationFrame(()=>{
    const copy = track.scrollWidth/2;
    if(copy>0) track.style.animationDuration = Math.max(40, Math.round(copy/38)) + "s";
  });
}

/* ---------------- CSV (planilha do Google) ---------------- */
function parseCSV(text){
  const rows = []; let row = [], cur = "", q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else{ if(c==='"') q=true; else if(c===",") {row.push(cur);cur="";} else if(c==="\n"){row.push(cur);rows.push(row);row=[];cur="";} else if(c!=="\r") cur+=c; }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}
function rowsToObjects(rows){
  if(!rows.length) return [];
  const head = rows[0].map(norm);
  return rows.slice(1).map(r=>{ const o={}; head.forEach((h,i)=>o[h]=(r[i]||"").trim()); return o; });
}
async function loadSheet(url){
  const r = await fetch(url, {cache:"no-store"});
  return rowsToObjects(parseCSV(await r.text()));
}
async function loadBirthdays(){
  const url = CFG.sheets?.birthdaysCsv;
  try{
    if(url){
      const objs = await loadSheet(url);
      state.birthdays = objs.map(o=>({
        name:o["nome"]||"", day:parseInt(o["dia"]||o["dia "]||"0",10)||0,
        month:parseInt(o["mes"]||"0",10)||0, dept:o["setor"]||o["departamento"]||"",
        photo:o["foto"]||o["foto (url)"]||o["url"]||""
      })).filter(b=>b.name);
    } else {
      state.birthdays = await (await fetch("birthdays.json",{cache:"no-store"})).json();
    }
  }catch(e){ if(!state.birthdays.length){ try{ state.birthdays = await (await fetch("birthdays.json")).json(); }catch(_){} } }
  renderSlides();
}
async function loadNotices(){
  const url = CFG.sheets?.noticesCsv;
  try{
    if(url){
      const objs = await loadSheet(url);
      state.notices = objs
        .filter(o=> (o["ativo"]===undefined) || /^(sim|s|1|true|x)$/.test(norm(o["ativo"])) )
        .map(o=>({ title:o["titulo"]||o["aviso"]||"", body:o["texto"]||o["descricao"]||o["mensagem"]||"" }))
        .filter(n=>n.title);
    } else {
      state.notices = await (await fetch("notices.json",{cache:"no-store"})).json();
    }
  }catch(e){ if(!state.notices.length){ try{ state.notices = await (await fetch("notices.json")).json(); }catch(_){} } }
  renderSlides();
}

/* ---------------- notícias (data.json do robô) ---------------- */
async function loadNews(){
  try{
    const j = await (await fetch("data.json",{cache:"no-store"})).json();
    state.news = (j.items||[]).map(n=>({...n}));
    renderTicker(); renderSlides();
  }catch(e){ /* mantém */ }
}

/* ---------------- brand ---------------- */
document.getElementById("brandName").textContent = CFG.brandName || "Bem-vindo(a)";

/* ---------------- start + atualizações periódicas ---------------- */
renderSlides();
loadNews();       setInterval(loadNews, 15*60*1000);      // notícias: 15 min
loadBirthdays();  setInterval(loadBirthdays, 5*60*1000);  // planilha: 5 min
loadNotices();    setInterval(loadNotices, 5*60*1000);
loadWeather();    setInterval(loadWeather, 30*60*1000);   // clima: 30 min
</script>
</body>
</html>
